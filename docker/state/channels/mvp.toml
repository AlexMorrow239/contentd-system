# The filename basename MUST equal `name` below: resumeJob resolves a job's
# channel config as <channelsDir>/<job.channel>.toml, so a mismatch wedges
# resume. loadChannelsDir rejects it at load time rather than at 3am.
name = "mvp"
niche = ["high-energy finance bro commentary", "stocks", "options", "crypto", "wealth building"]
script_model = "claude-sonnet-5"

# bg_dir MUST stay above every [section] header — TOML nests any
# top-level key written after a table header under that table. Paths are
# relative to the process cwd (/app in the container).
bg_dir = "assets/bg"

videos_per_day = 15
backlog_days = 2
platforms = ["youtube", "instagram"]

[voice]
volume = "af_heart"

[voice.premium]
provider = "elevenlabs"
voice_id = "Gubgw9l4dtIoQA9YZHgx"

[scout]
subreddits = [
  "wallstreetbets",
  "stocks",
  "investing",
  "StockMarket",
  "options",
  "Daytrading",
  "pennystocks",
  "SecurityAnalysis",
  "ValueInvesting",
  "dividends",
  "ETFs",
  "financialindependence",
  "personalfinance",
  "finance",
  "economics",
  "economy",
  "CryptoCurrency",
  "Bitcoin",
]
queue_days = 3

[budget]
per_video_usd = 0.5
per_day_usd = 25.0
