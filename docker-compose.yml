services:
  whisperx:
    build: ./sidecar/whisperx
    # Load-bearing for any channel without [voice.premium]: kokoro/edge-tts
    # return no word timings, so captions always falls through to this
    # sidecar. Without a restart policy the container does not come back
    # after a reboot and every job then hard-fails at the captions stage.
    restart: unless-stopped
    ports:
      - '8585:8585'
    environment:
      WHISPERX_DEVICE: cpu
      # The sidecar reads this at import to size its upload cap; compose
      # interpolates it from .env so the value there actually reaches the
      # container. Default matches the sidecar's own (app.py).
      WHISPERX_MAX_UPLOAD_MB: ${WHISPERX_MAX_UPLOAD_MB:-64}
    volumes:
      - whisperx-cache:/root/.cache # persist downloaded alignment models
    healthcheck:
      # python rather than curl: the sidecar image has no curl and adding one
      # for a probe is not worth a layer.
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8585/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  minio:
    image: minio/minio:latest
    # profiles keeps this OUT of a production `docker compose up -d`. Start it
    # explicitly for local work:
    #   docker compose --profile dev up -d minio
    profiles: [dev]
    command: server /data --console-address ":9001"
    restart: unless-stopped
    ports:
      # Host ports moved off MinIO's defaults: an unrelated `minio` container
      # for another project already holds BOTH 9000 and 9001 on this machine.
      # Container-internal ports are unchanged.
      - '9100:9000' # S3 API
      - '9101:9001' # web console
    environment:
      MINIO_ROOT_USER: brainrotdev
      MINIO_ROOT_PASSWORD: brainrotdev
    volumes:
      - minio-data:/data
    healthcheck:
      # `mc` ships in the minio image; the image has no curl.
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  brainrot:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    # Named so the dashboard service can reuse this exact image rather than
    # building a second copy of a ~2 GB layer stack.
    image: brainrot:latest
    restart: unless-stopped
    # PID 1 here is pnpm, which reaps nothing. Every Remotion render forks a
    # headless Chrome (plus ffmpeg), and any that outlives its parent is
    # re-parented to PID 1 and stays a zombie forever — harmless per render,
    # fatal over the weeks a long-lived daemon container runs, since the pid
    # table is finite. tini (init: true) reaps them.
    init: true
    depends_on:
      whisperx:
        condition: service_healthy
    # Forwards EVERY key in the host's (dev-pointing) .env — provider keys,
    # BRAINROT_TOKEN_KEY, the dev-facing BRAINROT_S3_* (MinIO), etc. — into
    # this container. The `environment:` block below overrides the keys that
    # must hold a different value in production; every other .env key passes
    # through unmodified (intended for provider keys, IG app credentials,
    # BRAINROT_TOKEN_KEY).
    env_file:
      - .env
    environment:
      # env_file above forwards EVERY key in the host's (dev-pointing) .env —
      # provider keys, BRAINROT_TOKEN_KEY, etc — straight into this container.
      # Compose applies `environment` after `env_file`, so only the keys
      # listed below are guaranteed to hold their production value regardless
      # of what the host .env says; every other .env key passes through
      # unmodified, which is intended for provider keys but was previously
      # unbounded for path/behavior toggles too. Anything host-only that
      # controls where data lands or how the pipeline behaves belongs here.
      # ONE root, holding db/, runs/ and channels/. Pinned here rather than
      # left to env_file: the host .env points at the dev root, and Compose
      # applies `environment` after every env_file, so this is what guarantees
      # the container reads production state no matter what the host .env says.
      BRAINROT_ROOT: /app/state
      # Service DNS, not localhost — the sidecar is a different container.
      WHISPERX_URL: http://whisperx:8585
      # The Dockerfile's `ENV TZ=America/Chicago` is only a default — an
      # env_file value of the same name overrides an image ENV — and
      # everything that reads local time (src/publish/schedule.ts's
      # per-channel-day videos_per_day quota via localDay, and the daemon's
      # 08:00 DIGEST_HOUR firing) reads the container's wall-clock time, so
      # pin it explicitly.
      TZ: America/Chicago
      # voice.ts:231 forces the free voice chain only when this is exactly
      # '1'; empty is verified equivalent to unset (safely OFF). Both
      # .env.example and the README invite setting BRAINROT_DEV_VOICE=1 for
      # local runs — if that landed in the host .env, every production video
      # would silently and permanently lose ElevenLabs with nothing in QC
      # catching it. Pinning to "" closes that off. Do not pin any other value.
      BRAINROT_DEV_VOICE: ''
      # Pins the cross-channel daily spend cap currently effective via the
      # host .env (BRAINROT_GLOBAL_DAILY_USD=12), so this commit does not
      # change today's budget behavior while removing the coupling to
      # whatever the host .env happens to contain. costs.ts treats an empty
      # string as "unset" (falls back to its own $25 default), so this must
      # be a real number, not "".
      BRAINROT_GLOBAL_DAILY_USD: '12'
      # Pins DEFAULT_YT_UPLOADS_PER_DAY from
      # src/publish/platforms/quota.ts (unset in .env today, so this was
      # already the effective value) rather than leaving it implicit. quota.ts
      # also treats "" as unset, so this must be a real integer, not "".
      BRAINROT_YT_UPLOADS_PER_DAY: '6'
      # BRAINROT_S3_* below is pinned to the production R2 credentials for
      # the same reason as BRAINROT_DEV_VOICE and BRAINROT_ROOT: env_file
      # forwards the host's (dev-pointing) .env wholesale, so without a pin
      # the container would run against MinIO — not even reachable from
      # here — instead of R2.
      #
      # BRAINROT_R2_* holds the real R2 credentials under distinct names
      # specifically so this mapping is possible: ${VAR} interpolates from
      # the project .env, and since BRAINROT_S3_* in that same file is the
      # MinIO value, `BRAINROT_S3_ENDPOINT: ${BRAINROT_S3_ENDPOINT}` would
      # just clobber R2 with MinIO. Filling BRAINROT_S3_ENDPOINT directly
      # here isn't an option either — it embeds the Cloudflare account id,
      # so it can't be a committed literal.
      BRAINROT_S3_ENDPOINT: ${BRAINROT_R2_ENDPOINT}
      BRAINROT_S3_BUCKET: brainrot-videos
      BRAINROT_S3_ACCESS_KEY_ID: ${BRAINROT_R2_ACCESS_KEY_ID}
      BRAINROT_S3_SECRET_ACCESS_KEY: ${BRAINROT_R2_SECRET_ACCESS_KEY}
      # R2 ignores region but the SDK requires one.
      BRAINROT_S3_REGION: 'auto'
      # Never set for production: presigning must sign against the real R2
      # endpoint. This exists only so a dev .env's MinIO value cannot leak in.
      BRAINROT_S3_PUBLIC_ENDPOINT: ''
    # The two OAuth callback ports, for `auth <platform> --headless` run via
    # `docker compose exec` against this container. Nothing listens on them
    # except during a 5-minute consent flow — they are published so the
    # operator's browser, which is on the host, can reach a callback listener
    # that lives in here.
    #
    # Bound to 127.0.0.1 on the HOST deliberately: the flow binds 0.0.0.0
    # INSIDE the container (a container-loopback listener is unreachable
    # through a published port), and this is what keeps that from being
    # reachable off-machine. The ports must match src/publish/oauth-flow.ts's
    # IG_AUTH_DEFAULT_PORT / YT_AUTH_DEFAULT_PORT, and Instagram's is
    # additionally pre-registered with Meta, so it cannot be renumbered here
    # alone.
    ports:
      - '127.0.0.1:51834:51834' # instagram consent callback (https, self-signed)
      - '127.0.0.1:51835:51835' # youtube consent callback (http)
    volumes:
      - ./assets:/app/assets:ro # 21 GB, never copied, never written
      # A NAMED VOLUME, deliberately not a bind mount. SQLite runs in WAL
      # mode (src/db/index.ts), and WAL coordinates readers/writers through a
      # shared-memory `-shm` file that every process touching the database
      # must mmap coherently. A bind mount from macOS reaches the Linux VM
      # over virtiofs, so the daemon (VM kernel) and any host-side CLI (macOS
      # kernel) are two different kernels sharing one APFS file — coherent
      # shared memory is impossible there, which is exactly the configuration
      # SQLite documents WAL as unsupported on. In practice it corrupted:
      # `database disk image is malformed`, then committed transactions
      # silently vanishing while the pipeline logged success and published for
      # real (two jobs rendered and posted to YouTube/Instagram with no rows
      # to show for it, and two more left `runs/` artifacts with no `jobs` row
      # at all). A named volume lives on the VM's own ext4, so every opener is
      # one kernel on one real filesystem.
      #
      # The cost is that the host can no longer open this file: operator
      # commands run `docker exec project-brainrot-brainrot-1 pnpm brainrot
      # <cmd>`. See README "Operating the database" for that and for the
      # backup one-liner. `runs/` below stays a bind mount — plain file I/O
      # over virtiofs is fine, and host-inspectable artifacts are worth it.
      #
      # Mounted at <root>/db rather than the root itself so the root can be a
      # plain image directory with the runs/ and channels/ binds beside this
      # volume, instead of binds nested inside a volume.
      - brainrot-data:/app/state/db
      - ./prod/runs:/app/state/runs # per-job artifacts, inspectable from the host
      - ./prod/channels:/app/state/channels:ro # production config, re-read every tick
    # Chrome's default 64 MB /dev/shm in Docker is the classic renderer crash.
    shm_size: 1gb
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'

  dashboard:
    # Same build context and image name as `brainrot`: compose builds the
    # image once and both services run it. Declaring only `image:` here would
    # make `docker compose up -d` try to PULL brainrot:latest from a registry
    # on a machine that has not built it yet.
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    image: brainrot:latest
    command: pnpm exec tsx src/dashboard/server.ts
    restart: unless-stopped
    # Deliberately no depends_on: whisperx. The dashboard reads a file and
    # serves HTML; coupling it to sidecar health would hide the dashboard you
    # would use to diagnose an unhealthy sidecar.
    # Deliberately NO env_file here, unlike `brainrot`. This is the one
    # process that terminates unauthenticated HTTP, and env_file would inject
    # every key in the host .env — ANTHROPIC_API_KEY, ELEVENLABS_API_KEY, and
    # BRAINROT_TOKEN_KEY (the AES key that decrypts YouTube refresh tokens) —
    # into it for no reason: every variable the dashboard actually reads is
    # already pinned below.
    environment:
      BRAINROT_ROOT: /app/state
      BRAINROT_DASHBOARD_PORT: '8787'
      # Read for the quota panel only; must match the brainrot service so the
      # dashboard reports the cap that is actually enforced.
      BRAINROT_YT_UPLOADS_PER_DAY: '6'
      # Read for the spend panel; same reasoning.
      BRAINROT_GLOBAL_DAILY_USD: '12'
      TZ: America/Chicago
    ports:
      # Loopback-bound on the HOST: unreachable from the network. There is no
      # auth layer, and this binding is what makes that acceptable.
      - '127.0.0.1:8787:8787'
    volumes:
      # READ-WRITE mount with a READ-ONLY connection — SQLite must create the
      # -shm file to read a WAL database, so a :ro mount breaks the dashboard
      # outright; the read-only guarantee lives in openDbReadonly's connection
      # flag. Same named volume as the brainrot service, for the WAL/virtiofs
      # reason documented there — and doubly so here, since this is a SECOND
      # concurrent opener.
      - brainrot-data:/app/state/db
      - ./prod/runs:/app/state/runs:ro # video playback only
      - ./prod/channels:/app/state/channels:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'

volumes:
  whisperx-cache:
  minio-data:
  # All persistent state: jobs, library, topics, costs, leases, publishes and
  # the encrypted oauth_tokens. Not a bind mount — see the brainrot service's
  # mount comment for why, and treat `docker volume rm brainrot-data` as
  # destroying every OAuth grant along with the run history.
  brainrot-data:
