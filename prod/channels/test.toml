name = "test"
niche = ["space facts", "astronomy"]
script_model = "claude-sonnet-5"
bg_dir = "assets/bg"
bgm_dir = "assets/bgm"
videos_per_day = 6

# No [voice.premium] table: this channel uses the free kokoro -> edge-tts
# chain. This is what makes the WhisperX sidecar mandatory for every job
# (see docker-compose.yml).
[voice]
volume = "af_heart"

# Subreddits are BARE names — the fetcher interpolates them raw after `r/`,
# so "r/space" would request /r/r/space/.rss. RSS entries must be full URLs.
# Works without Reddit API keys via the public .rss feeds.
[scout]
subreddits = ["space", "astronomy", "cosmology"]
rss = [
  "https://phys.org/rss-feed/space-news/",
  "https://earthsky.org/feed/",
]
per_source_limit = 25

[caption_style]
font = "Inter"
font_size_px = 72
active_color = "#FFD700"
inactive_color = "#FFFFFF"
stroke_px = 8

[budget]
per_video_usd = 0.5
per_day_usd = 10.0

# Cadence comes from videos_per_day above: the daemon's publish worker fires
# whenever a video is ready, gated only by the per-local-day videos_per_day
# quota and a fixed 10-minute cooldown between attempts (PUBLISH_COOLDOWN_MS,
# an anti-burst guard, not a schedule). There is no posting window; the count
# is a same-day ceiling, not a guarantee — falling short just means demand
# (a ready video) or the cap (per-platform quota) ran out first.
[publish]

[publish.youtube]
privacy = "private"
category_id = 24
made_for_kids = false

[publish.instagram]
ig_user_id = "17841447490773376"
share_to_feed = false
