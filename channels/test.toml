name = "test"
niche = ["space facts", "astronomy"]
script_model = "claude-sonnet-5"
bg_dir = "assets/bg"
bgm_dir = "assets/bgm"

[tier_mix]
volume = 2
premium = 1

[voice]
volume = "af_heart"

[voice.premium]
provider = "elevenlabs"
voice_id = "EXAVITQu4vr4xnSDxMaL"  # "Sarah" — public ElevenLabs premade voice
model = "eleven_multilingual_v2"

[premium]
image_model = "fal-ai/flux/dev"
video_model = "fal-ai/kling-video/v3/standard/image-to-video"
style_prefix = "vivid digital illustration, cinematic lighting"
scene_concurrency = 3

[caption_style]
font = "Inter"
font_size_px = 72
active_color = "#FFD700"
inactive_color = "#FFFFFF"
stroke_px = 8

[budget]
# Volume videos cost ~$0.05-0.15 (sonnet script + free local TTS); 0.50 is
# generous headroom that still catches a runaway stage.
per_video_usd = 0.5
# Premium realistically lands $3-6 (ElevenLabs + fal image/video per scene).
premium_per_video_usd = 7.0
# Worst honest day under tier_mix 2v+1p: 2 x 0.5 + 7 = 8; 10 leaves headroom
# while staying well under the global daily cap. Keep >= premium_per_video_usd
# or a premium video can never fit in a day.
per_day_usd = 10.0

[publish]
slots = ["10:00", "14:00", "19:00"]
platforms = ["youtube"]
privacy = "private"
category_id = 24
made_for_kids = false
