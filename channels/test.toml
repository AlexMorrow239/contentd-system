name = "test"
niche = ["space facts", "astronomy"]
script_model = "claude-sonnet-5"
bg_dir = "assets/bg"
bgm_dir = "assets/bgm"
videos_per_day = 3

# No [voice.premium] table: this channel uses the free kokoro -> edge-tts
# chain. This is what makes the WhisperX sidecar mandatory for every job
# (see docker-compose.yml).
[voice]
volume = "af_heart"

# Subreddits are BARE names — the fetcher interpolates them raw after `r/`,
# so "r/space" would request /r/r/space/.rss. RSS entries must be full URLs.
# Works without Reddit API keys via the public .rss feeds.
[scout]
subreddits = ["space", "astronomy", "cosmology"]
rss = [
  "https://phys.org/rss-feed/space-news/",
  "https://earthsky.org/feed/",
]
min_score = 60
per_source_limit = 25

[caption_style]
font = "Inter"
font_size_px = 72
active_color = "#FFD700"
inactive_color = "#FFFFFF"
stroke_px = 8

[budget]
per_video_usd = 0.5
per_day_usd = 10.0

# Only one video exists per day, so the later two slots noop at zero cost —
# they are insurance: a slot missed while the Mac sleeps stays due for the
# rest of the LOCAL day. Slot times are machine-local, unlike the UTC
# budget/quota day.
[publish]
slots = ["10:00", "14:00", "19:00"]

[publish.youtube]
privacy = "private"
category_id = 24
made_for_kids = false

[publish.instagram]
ig_user_id = "17841400000000000"
share_to_feed = true
