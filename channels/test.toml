name = "test"
niche = ["space facts", "astronomy"]
script_model = "claude-sonnet-5"
bg_dir = "assets/bg"
bgm_dir = "assets/bgm"

# One premium video per UTC day, no volume videos. `0 < 0` is false, so the
# volume slot is permanently closed; filledFraction still divides by
# volume + premium = 1, so this is not the both-zero NaN case.
[tier_mix]
volume = 0
premium = 1

# No [voice.premium] table on purpose: premium jobs fall through to the same
# free kokoro -> edge-tts chain volume tier uses. This is what makes the
# WhisperX sidecar mandatory for every job (see docker-compose.yml).
[voice]
volume = "af_heart"

# Subreddits are BARE names — the fetcher interpolates them raw after `r/`,
# so "r/space" would request /r/r/space/.rss. RSS entries must be full URLs.
# Works without Reddit API keys via the public .rss feeds.
[scout]
subreddits = ["space", "astronomy", "cosmology"]
rss = [
  "https://phys.org/rss-feed/space-news/",
  "https://earthsky.org/feed/",
]
min_score = 60
per_source_limit = 25
# Mandatory for an unattended premium-only channel: with the default false,
# the premium tier can only draw topics approved by hand, so the loop would
# scout candidates forever and never produce anything.
auto_premium = true

[premium]
image_model = "fal-ai/flux/dev"
video_model = "fal-ai/kling-video/v3/standard/image-to-video"
style_prefix = "vivid digital illustration, cinematic lighting"
scene_concurrency = 3

[caption_style]
font = "Inter"
font_size_px = 72
active_color = "#FFD700"
inactive_color = "#FFFFFF"
stroke_px = 8

[budget]
# Unused while volume = 0, but the schema requires it positive.
per_video_usd = 0.5
# Honest worst case is 8 scenes x 10s plus a keyframe retry, ~$7.4-7.5 —
# above the old 7.0 cap, which would block long videos mid-render.
premium_per_video_usd = 8.0
# The real daily ceiling. Must stay >= premium_per_video_usd or a premium
# video can never fit in a day.
per_day_usd = 10.0

# Only one video exists per day, so the later two slots noop at zero cost —
# they are insurance: a slot missed while the Mac sleeps stays due for the
# rest of the LOCAL day. Slot times are machine-local, unlike the UTC
# budget/quota day.
[publish]
slots = ["10:00", "14:00", "19:00"]
platforms = ["youtube"]
privacy = "private"
category_id = 24
made_for_kids = false
